[package]
name = "mimir-desktop"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
# Copying and saving from the app: the webview has no reliable clipboard, and no downloads without a handler.
arboard = { version = "3", default-features = false }
dirs = "6"
anyhow = "1.0.104"
mimir-core = { path = "../mimir-core", features = ["local-whisper"] }
# Meeting transcription: the microphone (everywhere) and, on macOS, the computer's own sound.
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
# A database that can't open is shown in a dialog before Tauri starts (GTK on Linux, which Tauri already uses).
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
# One app per data folder: a second launch shows the first instead of running the same bots twice.
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.53.2", features = ["full"] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple GPU for whisper.cpp.
mimir-core = { path = "../mimir-core", features = ["local-whisper", "metal", "diarize"] }
screencapturekit = "11"
libc = "0.2"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
# The call's sound through a Core Audio process tap (macOS 14.4+).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# Telling speakers apart on Linux: sherpa-onnx's shared libraries, downloaded on first use (it has no static Linux build).
mimir-core = { path = "../mimir-core", features = ["local-whisper", "diarize-dl"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# Telling speakers apart (sherpa-onnx, linked in).
mimir-core = { path = "../mimir-core", features = ["local-whisper", "diarize"] }
