[workspace]
resolver = "3"
members = ["crates/mimir-core", "crates/mimir", "crates/mimir-desktop"]

# The one place the version lives: every crate inherits it, and the desktop app takes it from its crate (tauri.conf.json
# has none). The release workflow checks the tag against it.
[workspace.package]
version = "0.4.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Shrinking a photo for a model is CPU-heavy; keep it quick in dev builds and tests too.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3

# Windows dev builds: sherpa-rs-sys's build script links the debug dynamic C runtime (msvcrtd) whenever it was compiled
# with debug assertions. Everything else uses the static release runtime (.cargo/config.toml), and two runtimes in one
# process means two heaps: the app and its tests died on a debug-heap assertion (is_block_type_valid). Without debug
# assertions that build script doesn't add it. Release builds were never affected.
[profile.dev.package.sherpa-rs-sys]
debug-assertions = false
